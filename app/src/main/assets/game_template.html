<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>许愿井 · 示例游戏</title>
<style>
  /* 全屏无滚动、禁用触摸手势缩放 */
  html,body{margin:0;padding:0;width:100%;height:100%;overflow:hidden;background:#111;
    touch-action:none;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;}
  #g{display:block;width:100vw;height:100vh;background:#14142b;}
  #hud{position:fixed;top:14px;left:0;right:0;text-align:center;color:#fff;
    font:600 16px/1.6 system-ui,sans-serif;pointer-events:none;text-shadow:0 1px 2px rgba(0,0,0,.7);}
</style>
</head>
<body>
<canvas id="g"></canvas>
<div id="hud">得分：<span id="score">0</span></div>
<script>
'use strict';
var canvas = document.getElementById('g'), ctx = canvas.getContext('2d');
var W = 0, H = 0;

// —— 窗口尺寸自适应（含高分屏）——
function resize(){
  var dpr = window.devicePixelRatio || 1;
  W = window.innerWidth; H = window.innerHeight;
  canvas.width = W * dpr; canvas.height = H * dpr;
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
}
window.addEventListener('resize', resize);
resize();

// —— 游戏状态 ——
var score = 0, over = false;
var px = W / 2, py = H - 70, pw = 110, ph = 16;
var balls = [];
var touchX = null;

// —— 触控：手指滑动控制挡板 ——
canvas.addEventListener('touchstart', function(e){ e.preventDefault(); touchX = e.touches[0].clientX; }, {passive:false});
canvas.addEventListener('touchmove',  function(e){ e.preventDefault(); touchX = e.touches[0].clientX; }, {passive:false});
canvas.addEventListener('touchend',   function(e){ e.preventDefault(); touchX = null; }, {passive:false});
canvas.addEventListener('mousemove',  function(e){ touchX = e.clientX; });

// —— 主循环：requestAnimationFrame + dt 钳制 ——
var last = 0;
function frame(t){
  var dt = Math.min((t - last) / 1000, 0.05); // 防卡顿跳帧
  last = t;
  update(dt);
  draw();
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);

function update(dt){
  if (over) return;
  if (touchX != null) px += (touchX - px) * 8 * dt;
  px = Math.max(pw/2, Math.min(W - pw/2, px));

  if (Math.random() < 0.4 * dt) {
    balls.push({x: Math.random()*W, y: -14, r: 12, v: 130 + Math.random()*60});
  }
  for (var i = balls.length - 1; i >= 0; i--) {
    var b = balls[i];
    b.y += b.v * dt;
    if (b.y + b.r >= py - ph/2 && Math.abs(b.x - px) < pw/2 + b.r) {
      score++;
      document.getElementById('score').textContent = score;
      beep(660);
      balls.splice(i, 1);
    } else if (b.y - b.r > H) {
      over = true;
    }
  }
}

function draw(){
  ctx.fillStyle = '#14142b'; ctx.fillRect(0, 0, W, H);
  ctx.fillStyle = '#7b5cff'; ctx.fillRect(px - pw/2, py - ph/2, pw, ph);
  ctx.fillStyle = '#ff6b6b';
  for (var i = 0; i < balls.length; i++) {
    var b = balls[i];
    ctx.beginPath(); ctx.arc(b.x, b.y, b.r, 0, 6.2832); ctx.fill();
  }
  if (over) {
    ctx.fillStyle = '#fff'; ctx.font = '24px system-ui,sans-serif'; ctx.textAlign = 'center';
    ctx.fillText('游戏结束，得分 ' + score, W/2, H/2);
  }
}

// —— 重开 ——
function restart(){
  score = 0; over = false; balls = [];
  px = W / 2;
  document.getElementById('score').textContent = '0';
}

// —— WebAudio 简易音效（振荡器，无外部资源）——
var actx = null;
function beep(f){
  try {
    if (!actx) actx = new (window.AudioContext || window.webkitAudioContext)();
    var o = actx.createOscillator(), g = actx.createGain();
    o.frequency.value = f; o.type = 'square';
    o.connect(g); g.connect(actx.destination);
    g.gain.setValueAtTime(0.15, actx.currentTime);
    g.gain.exponentialRampToValueAtTime(0.001, actx.currentTime + 0.12);
    o.start(); o.stop(actx.currentTime + 0.13);
  } catch(e){}
}
</script>
</body>
</html>
